<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搵唔到呢頁 · Maniss.ch</title>
<meta name="robots" content="noindex">
<style>
:root{--ground:#F7F4EF;--ink:#2E2A26;--ink-2:#7C7369;--line-2:#D2C8B9;--accent:#4F6473;--blush:#C79E98}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);
  font-family:"Noto Sans TC","PingFang HK","Hiragino Sans",Arial,sans-serif;font-weight:300;letter-spacing:.04em;padding:1.5rem}
main{text-align:center;max-width:26rem}
.mark{font-family:"Jost","Helvetica Neue",Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;font-size:1rem}
.mark span{color:var(--blush)}
h1{font-weight:300;font-size:1.3rem;letter-spacing:.14em;margin:2rem 0 .8rem}
p{color:var(--ink-2);font-size:.9rem;line-height:2;margin:0 0 2rem}
a.btn{display:inline-block;padding:.8rem 1.6rem;border:1px solid var(--accent);background:var(--accent);color:#FCFAF7;
  text-decoration:none;font-size:.8rem;letter-spacing:.16em}
a.btn:hover{background:transparent;color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="mark">Maniss<span>.</span>ch</div>
  <h1>搵唔到呢一頁</h1>
  <p>條連結可能打錯咗，或者頁面已經搬咗。</p>
  <a class="btn" href="/">返去主頁</a>
</main>
</body>
</html>
